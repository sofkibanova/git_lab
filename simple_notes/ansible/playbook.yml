- name: Deploy Simple Notes to Ubuntu
  hosts: servers
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create directory
      ansible.builtin.file:
        path: /opt/simple_notes
        state: directory
        mode: "0755"

    - name: Copy frontend
      ansible.builtin.copy:
        src: ../frontend/
        dest: /opt/simple_notes/frontend/
        mode: preserve
      register: frontend_copy

    - name: Copy backend
      ansible.builtin.copy:
        src: ../backend/
        dest: /opt/simple_notes/backend/
        mode: preserve
      register: backend_copy

    - name: Copy docker compose
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: /opt/simple_notes/docker-compose.yml
        mode: "0644"
      register: compose_copy

    - name: Build and start application after changes
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /opt/simple_notes
      when: >-
        frontend_copy.changed or
        backend_copy.changed or
        compose_copy.changed

    - name: Make sure application is running
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/simple_notes
      when: >-
        not (
          frontend_copy.changed or
          backend_copy.changed or
          compose_copy.changed
        )
      changed_when: false
